<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore Activities | ExploreÉire</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <nav class="navbar">

      <h1 class="logo">ExploreÉire</h1>

      <ul class="nav-links">
        <li>
          <a href="index.html">Home</a>
        </li>

        <li>
          <a href="activities.html">Explore</a>
        </li>

        <li>
          <a href="dashboard.html">Dashboard</a>
        </li>

        <li>
          <a href="about.html">About</a>
        </li>
        <li><a href="add-activity.html">Add Activity</a></li>
      </ul>

    </nav>
  </header>


  <main class="page-content">

    <section class="activities-heading">

      <h2>Explore Irish Activities</h2>

      <p>
        Browse cultural, historical and outdoor experiences across Ireland.
      </p>

    </section>

<section class="filter-section">
  <input
    type="text"
    id="search-input"
    placeholder="Search activities"
  >

  <select id="county-filter">
    <option value="all">All counties</option>
    <option value="Dublin">Dublin</option>
    <option value="Galway">Galway</option>
    <option value="Clare">Clare</option>
  </select>

  <select id="category-filter">
    <option value="all">All categories</option>
    <option value="Museum">Museum</option>
    <option value="Nature">Nature</option>
  </select>

  <select id="price-filter">
    <option value="all">All prices</option>
    <option value="Free">Free</option>
    <option value="Paid">Paid</option>
  </select>
</section>


    <section
      id="activity-container"
      class="activity-container"
    >

      <p>Loading activities...</p>

    </section>

  </main>


  <script src="js/activities.js"></script>

</body>

</html>
