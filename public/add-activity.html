<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Activity | ExploreÉire</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <nav class="navbar">
      <h1 class="logo">ExploreÉire</h1>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="activities.html">Explore</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="add-activity.html">Add Activity</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">

    <section class="form-section">

      <h2>Add a New Activity</h2>

      <p>
        Use this form to add a new Irish activity to the ExploreÉire database.
      </p>

      <form id="activity-form">

        <label for="name">Activity name</label>
        <input type="text" id="name" required>

        <label for="county">County</label>
        <input type="text" id="county" required>

        <label for="city">Town or city</label>
        <input type="text" id="city" required>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Choose a category</option>
          <option value="Museum">Museum</option>
          <option value="Nature">Nature</option>
          <option value="Historical">Historical</option>
          <option value="Cultural">Cultural</option>
          <option value="Educational">Educational</option>
          <option value="Entertainment">Entertainment</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" rows="5" required></textarea>

        <label for="price-type">Price type</label>
        <select id="price-type" required>
          <option value="">Choose a price type</option>
          <option value="Free">Free</option>
          <option value="Paid">Paid</option>
        </select>

        <label for="price">Price in euro</label>
        <input type="number" id="price" min="0" step="0.01" required>

        <label for="duration">Duration in minutes</label>
        <input type="number" id="duration" min="1" required>

        <label for="environment">Environment</label>
        <select id="environment" required>
          <option value="">Choose an environment</option>
          <option value="Indoor">Indoor</option>
          <option value="Outdoor">Outdoor</option>
          <option value="Mixed">Mixed</option>
        </select>

        <label for="rating">Rating</label>
        <input
          type="number"
          id="rating"
          min="1"
          max="5"
          step="0.1"
          required
        >

        <label class="checkbox-label">
          <input type="checkbox" id="student-friendly">
          Student-friendly
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="accessible">
          Wheelchair accessible
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="featured">
          Featured activity
        </label>

        <button type="submit" class="main-button">
          Add activity
        </button>

        <p id="form-message"></p>

      </form>

    </section>

  </main>

  <script src="/js/add-activity.js"></script>

</body>

</html>
